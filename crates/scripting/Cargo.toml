[package]
name = "egui-charts-scripting"
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Scripts that add studies to egui-charts: a series runtime with a Rhai front end"
repository = "https://github.com/userFRM/egui-charts"

# A package of its own next to the library, like `terminal/`, built on its own and never by the
# library.
[workspace]

[dependencies]
# Studies and the backtester without egui, so the default build of this crate stays headless.
egui-charts = { path = "../..", version = "=0.3.0-alpha.1", default-features = false, features = ["studies", "strategies"] }
# No default features: no runtime random seed, so the wasm32 build needs no JavaScript random
# source; `no_time` and `no_module` remove the clock and file imports.
rhai = { version = "1.27.0", default-features = false, features = ["std", "sync", "no_time", "no_module"] }
# Plot and fill colours, the colour type of the library's study styles.
ecolor = { version = "0.37.0", default-features = false }
# The clock of the time limits; `std::time::Instant` panics on wasm32-unknown-unknown.
web-time = "1.1.0"
# Bar times, which the time helpers read in UTC.
chrono = { version = "0.4.43", default-features = false, features = ["std"] }

[dev-dependencies]
# The example is an `eframe` app on the chart widget, built as the library's examples are.
egui-charts = { path = "../..", version = "=0.3.0-alpha.1", default-features = false, features = ["studies", "widget"] }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "x11", "wayland"] }
egui = "0.37.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The shared sample history of the library's examples.
rand = "0.10.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The time-slicing test runs in a headless browser.
wasm-bindgen-test = "0.3.79"

# The library's scripting example, built here until the examples move into the scripting feature.
[[example]]
name = "scripted_study"
path = "../../examples/scripting.rs"

[[bench]]
name = "scripting"
harness = false
