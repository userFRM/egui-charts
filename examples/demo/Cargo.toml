[package]
name = "egui-charts-demo"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "egui-charts-demo"
path = "main.rs"

[dependencies]
egui-charts = { path = "../..", features = ["ui", "alert-engine", "strategies", "detectors"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "persistence"] }
# The emoji fonts draw the icons the drawing bar's Icons/Emojis menu places.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
# Embedded SVGs and validated PNG/JPEG bytes; native builds also load local files.
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "image"] }
chrono = "0.4.43"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"

# Native gets the windowing backends and the system clipboard.
# WASM uses the canvas backend and browser downloads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_extras = { version = "0.37.0", default-features = false, features = ["file"] }
maudio = "0.1.15"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow", "links", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Check recording size before the browser allocates its bytes.
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioContextState"] }
console_error_panic_hook = "0.1.7"

# `index.html` builds the web release with this profile; native builds keep `release`.
# The same as the library's `wasm-release`, which explains the settings.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# Frame-driven tests also generate synthetic history in the demo itself.
[profile.test]
opt-level = 2

# Keep dependencies optimised; the chart uses level 1 because it is rebuilt on every change.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.egui-charts]
opt-level = 1
