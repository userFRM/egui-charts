[package]
name = "egui-charts-demo"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "egui-charts-demo"
path = "main.rs"

[dependencies]
egui-charts = { path = "../..", features = ["ui"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
chrono = "0.4.43"
log = "0.4.29"

# Native gets the windowing backends winit needs, the system clipboard and PNG encoding
# for the screenshot button. WASM uses the canvas backend and a browser download, so it
# needs none of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
