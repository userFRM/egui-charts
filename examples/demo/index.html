<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>egui-charts | Live Demo</title>
    <script>
        // Read the same settings document as DemoStorage before the loading screen paints.
        try {
            let theme = localStorage.getItem('dark_theme');
            theme = theme === 'true' ? 'dark' : theme === 'false' ? 'light' : null;
            const documents = localStorage.getItem('templates') || '';
            const entry = documents.match(/"Settings\/settings"\s*:\s*("(?:\\.|[^"\\])*")/);
            if (entry) {
                // eframe stores the string map as RON; JSON also decodes its standard escapes.
                const encoded = entry[1].replace(/\\(?:'|u\{([0-9a-fA-F]+)\}|.)/g, (escape, code) =>
                    escape === "\\'" ? "'" : code ?
                        JSON.stringify(String.fromCodePoint(parseInt(code, 16))).slice(1, -1) : escape);
                const document = JSON.parse(JSON.parse(encoded));
                if (document.version === 1) theme = document.settings.theme;
            }
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (_) {
            // Unavailable or unreadable storage leaves the system appearance in control.
        }
    </script>
    <style>
        :root { color-scheme: light; --bg: #fff; --text: #666; --border: #ebebeb; }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; --bg: #000; --text: #a6a6a6; --border: #2a2a2a; }
        }
        :root[data-theme="light"] { color-scheme: light; --bg: #fff; --text: #666; --border: #ebebeb; }
        :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --text: #a6a6a6; --border: #2a2a2a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
        canvas { width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            z-index: 10;
        }
        #loading .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: #2962ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        Loading egui-charts demo&hellip;
    </div>
    <canvas id="demo_canvas"></canvas>
    <link data-trunk rel="rust" data-cargo-profile-release="wasm-release" data-wasm-opt="z" />
    <!-- The module embeds egui's default fonts and Lucide icons; their licences are published next to this page. -->
    <link data-trunk rel="copy-file" href="LICENSE-fonts.txt" />
    <link data-trunk rel="copy-file" href="../../assets/icons/LICENSE-lucide.txt" />
    <script>
        // Hide loading overlay once the canvas starts rendering
        const canvas = document.getElementById('demo_canvas');
        const observer = new MutationObserver(() => {
            if (canvas.width > 0 && canvas.height > 0) {
                document.getElementById('loading').style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(canvas, { attributes: true });
        // Fallback: hide after 8s regardless
        setTimeout(() => {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        }, 8000);
    </script>
</body>
</html>
