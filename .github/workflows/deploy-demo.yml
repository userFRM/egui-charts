name: Pages

# Builds the project site on every pull request and publishes it to GitHub
# Pages on every push to `main`: the WebAssembly demo at /egui-charts/demo/,
# and for now the same page at /egui-charts/.  Pages must be enabled for the
# repository with the source set to "GitHub Actions" for the deploy job to
# publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"

# Allow only one concurrent deployment, cancelling in-progress runs of the same
# ref so a newer commit always wins the Pages publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the native examples and the site exactly as it is published, so a
  # broken demo never lands.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/demo -> target
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v${{ env.TRUNK_VERSION }}"
      - name: Build native examples
        run: cargo build --examples
      - name: Build wasm demo
        working-directory: examples/demo
        run: trunk build --release --public-url /egui-charts/demo/
      # The demo's asset URLs are absolute, so its index.html also works at the
      # site root.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r examples/demo/dist _site/demo
          cp examples/demo/dist/index.html _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
