name: Deploy Demo

# Builds the WebAssembly demo as a compile check on every pull request, and
# publishes it to GitHub Pages on every push to `main`.  Pages must be enabled
# for the repository with the source set to "GitHub Actions" for the deploy job
# to publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"

# Allow only one concurrent deployment, cancelling in-progress runs of the same
# ref so a newer commit always wins the Pages publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile check: build the wasm demo and the native examples on pull requests
  # (and on pushes, as a gate before deploy) so a broken demo never lands.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v${{ env.TRUNK_VERSION }}"
      - name: Build native examples
        run: cargo build --examples
      - name: Build wasm demo
        working-directory: examples/demo
        run: trunk build --release

  # Deploy: rebuild the demo with the project-Pages base href and publish the
  # `dist/` output.  Runs only on pushes to `main`.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v${{ env.TRUNK_VERSION }}"
      - name: Build wasm demo for project Pages
        working-directory: examples/demo
        run: trunk build --release --public-url /egui-charts/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/demo/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
