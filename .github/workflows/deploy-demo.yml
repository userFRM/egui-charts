name: Pages

# Builds the project site on every pull request and publishes it to GitHub
# Pages on every push to `main`: the WebAssembly demo at /egui-charts/demo/,
# the same page at /egui-charts/, and the guide and API at /egui-charts/docs/.
# Pages must use the "GitHub Actions" source for the deploy job to publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"

# Allow only one concurrent deployment, cancelling in-progress runs of the same
# ref so a newer commit always wins the Pages publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the native examples and the site exactly as it is published, so a
  # broken demo or documentation build never lands.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/demo -> target
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v${{ env.TRUNK_VERSION }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci
      - name: Test documentation examples
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --doc --all-features
      - name: Build Starlight guide
        working-directory: docs/site
        run: npm run build
      - name: Build API reference
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --all-features
      - name: Build native examples
        run: cargo build --examples
      - name: Build wasm demo
        working-directory: examples/demo
        run: trunk build --release --public-url /egui-charts/demo/
      # The demo's asset URLs are absolute, so its index.html also works at the
      # site root.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r examples/demo/dist _site/demo
          cp examples/demo/dist/index.html _site/index.html
          cp -r docs/site/dist _site/docs
          cp -r target/doc _site/docs/api
          # rustdoc's crate index is nested; give /docs/api/ a stable entry point.
          cat > _site/docs/api/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=egui_charts/index.html">
          <title>egui-charts API reference</title><a href="egui_charts/index.html">Open the API reference</a></html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
