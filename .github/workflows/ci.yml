name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  # Runs the suite on any branch, such as reviewed pull requests merged together before they land.
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks; every main commit keeps its run.
# Draft state is part of the group: marking a draft ready fires a run that still carries the draft
# payload, and that run only skips its jobs, so it must not cancel the real run beside it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    if: github.event.pull_request.draft != true
    name: Check changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.inputs.outputs.base }}
      rust: ${{ steps.inputs.outputs.rust }}
      terminal: ${{ steps.inputs.outputs.terminal }}
      native: ${{ steps.inputs.outputs.native }}
      fmt: ${{ steps.inputs.outputs.fmt }}
      docs: ${{ steps.inputs.outputs.docs }}
      security: ${{ steps.inputs.outputs.security }}
      counts: ${{ steps.inputs.outputs.counts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed inputs
        id: inputs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The pull request run measures the merge of the head into the base branch, so the
          # performance baseline is the base branch itself; the changed paths are the head's own.
          echo "base=$(git rev-parse "$BASE_REF^{commit}")" >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames -z "$(git merge-base "$BASE_REF" "$HEAD_REF")" "$HEAD_REF" > changed-paths
          rust=false terminal=false native=false fmt=false docs=false security=false counts=false
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|ROADMAP.md) docs=true counts=true ;;
              docs/builder-guide.md|docs/study-data.md|docs/strategy-report.md|docs/site/src/content/docs/*.mdx) docs=true ;;
              *.md|docs/site/*|docs/progress/*) ;;
              terminal/*) terminal=true fmt=true security=true ;;
              examples/demo/*) native=true fmt=true security=true ;;
              examples/docs/*|docs/capture/*|fuzz/*) fmt=true security=true ;;
              deny.toml) security=true ;;
              .github/workflows/ci.yml) rust=true terminal=true native=true ;;
              tests/*|benches/*|examples/*|.github/check-module-cycles.py) rust=true ;;
              .github/workflows/*|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml|.github/FUNDING.yml) ;;
              *) rust=true terminal=true native=true ;;
            esac
          done < changed-paths
          if [[ $rust == true ]]; then
            fmt=true docs=true security=true counts=true
          fi
          # Main and manual or reusable runs always exercise the complete suite.
          if [[ $EVENT_NAME != pull_request ]]; then
            rust=true terminal=true native=true fmt=true docs=true security=true counts=true
          fi
          printf '%s\n' "rust=$rust" "terminal=$terminal" "native=$native" "fmt=$fmt" \
            "docs=$docs" "security=$security" "counts=$counts" >> "$GITHUB_OUTPUT"

  semver:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - name: Resolve the latest published crate version
        if: needs.changes.outputs.rust == 'true'
        id: baseline
        shell: bash
        run: |
          version=$(curl --fail --silent --show-error --retry 3 -A "egui-charts-ci (https://github.com/userFRM/egui-charts)" https://crates.io/api/v1/crates/egui-charts | jq -er '.crate.newest_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the declared release against the published API
        if: needs.changes.outputs.rust == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-version: ${{ steps.baseline.outputs.version }}

  check:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, 1.95.0]
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      # Clippy with --all-targets compiles each configuration, so it doubles as the build check.
      # The minimum supported Rust version only needs to prove it compiles the full feature set.
      - name: Check module dependencies
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: python3 .github/check-module-cycles.py
      - name: Clippy (all features)
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Clippy (default)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (headless engine)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Clippy (widget only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features widget --all-targets -- -D warnings
      - name: Clippy (CSV only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features csv --all-targets -- -D warnings
      - name: Clippy (PNG export only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features png-export --all-targets -- -D warnings
      - name: Clippy (icons only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features icons --all-targets -- -D warnings
      - name: Clippy (widget with drawings)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features widget,drawings --all-targets -- -D warnings
      - name: Clippy (studies only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features studies --all-targets -- -D warnings
      - name: Clippy (alert engine only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features alert-engine --all-targets -- -D warnings
      - name: Clippy (order-flow detectors only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features detectors --all-targets -- -D warnings
      - name: Clippy (strategies only)
        if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features strategies --all-targets -- -D warnings

  test:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 30 }}
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      # Linux splits the feature subsets into the jobs below; every platform keeps the
      # all-features library tests. The check job proves the minimum supported Rust version.
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      # Debug info is a large share of each Windows compile and link, and the tests never read it;
      # panics still report their source line without it. Set through the file because Cargo rejects
      # an empty value.
      - name: Skip debug info on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo CARGO_PROFILE_DEV_DEBUG=0 >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true' || (matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true')
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.docs == 'true' || (matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true')
        id: toolchain
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs == 'true' && matrix.os == 'macos-latest'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Linux keeps both dependency graphs; per-workspace cleanup would prune the other's artifacts.
      # Exact key only: a prefix fallback would carry stale artifacts into every new entry and grow
      # it without bound, since nothing prunes this target.
      - uses: actions/cache/restore@v5
        if: matrix.os == 'windows-latest' && needs.changes.outputs.docs == 'true'
        id: windows-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-test-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.github/workflows/ci.yml') }}
      - uses: actions/cache/restore@v5
        if: matrix.os == 'ubuntu-latest' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.native == 'true')
        id: linux-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-native-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'examples/demo/Cargo.toml', 'examples/demo/Cargo.lock', '.github/workflows/ci.yml') }}
      - name: Run library tests (all features)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --all-features --lib
      - name: Run doc tests (no default features)
        if: needs.changes.outputs.docs == 'true'
        run: cargo test --doc --no-default-features
      - name: Install Linux graphics and window tools
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Build native demo
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --manifest-path examples/demo/Cargo.toml
      - name: Test demo controller
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --locked --manifest-path examples/demo/Cargo.toml
      - name: Start native demo on Linux
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.native == 'true'
        env:
          WGPU_BACKEND: vulkan
        # The readiness probe disconnects before the demo connects; do not reset the server then.
        run: xvfb-run -a -e /dev/stderr -s '-screen 0 1280x1024x24 -noreset' examples/demo/smoke-native.sh target/debug/egui-charts-demo
      - uses: actions/cache/save@v5
        if: matrix.os == 'windows-latest' && github.ref == 'refs/heads/main' && steps.windows-cache.outputs.cache-primary-key != '' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && steps.linux-cache.outputs.cache-primary-key != '' && steps.linux-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

  # The demo recompiles the library with its own features and profile, so on Windows it shares only
  # the dependency cache with the test job, and its own job keeps both under ten minutes.
  native-demo:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Native demo (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.native == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.native == 'true'
        id: toolchain
        with:
          toolchain: stable
      # Exact key only, like the test job's cache.
      - uses: actions/cache/restore@v5
        if: needs.changes.outputs.native == 'true'
        id: windows-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-demo-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'examples/demo/Cargo.toml', 'examples/demo/Cargo.lock', '.github/workflows/ci.yml') }}
      - name: Build native demo
        if: needs.changes.outputs.native == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --manifest-path examples/demo/Cargo.toml
      - name: Test demo controller
        if: needs.changes.outputs.native == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --locked --manifest-path examples/demo/Cargo.toml
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main' && steps.windows-cache.outputs.cache-primary-key != '' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}

  test-features:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Test (Linux feature subsets and examples)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run library tests (no default features)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --lib
      - name: Run library tests (CSV only)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --features csv --lib
      - name: Run library tests (widget only)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --features widget --lib
      - name: Run library tests (PNG export only)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --features png-export --lib
      - name: Run library tests (icons only)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --features icons --lib
      - name: Run example tests
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --all-features --example scripting --example backtesting --example network_feed
      - name: Run doc tests (all features)
        if: needs.changes.outputs.docs == 'true'
        run: cargo test --doc --all-features
      - name: Run doc tests (widget only)
        if: needs.changes.outputs.docs == 'true'
        run: cargo test --doc --no-default-features --features widget

  test-ui:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Test (Linux UI without named time zones)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run library tests (UI without named time zones)
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --no-default-features --features ui --lib

  wasm-test:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Test (headless Chrome, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [all, widget]
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          tool: wasm-pack
      - name: Run browser widget tests
        if: needs.changes.outputs.rust == 'true'
        run: >-
          wasm-pack test --headless --chrome --lib
          ${{ matrix.features == 'all' && '--all-features' || '--no-default-features --features widget' }}
      - name: Build the network feed example for the browser
        if: needs.changes.outputs.rust == 'true' && matrix.features == 'widget'
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features widget,http --example network_feed -- -D warnings

  bare-chart:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Bare chart size and frame cost
    # Pinned image and compiler: the figures move with the code, the lockfile, the MSRV and the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - name: Install Valgrind
        if: needs.changes.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Build
        if: needs.changes.outputs.rust == 'true'
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: >-
          cargo build --release --locked --no-default-features --features widget
          --example bare_chart --bench bare_chart --message-format=json-render-diagnostics > build.json
      - name: Compare with benches/bare_chart.baseline
        if: needs.changes.outputs.rust == 'true'
        run: |
          bench=$(jq -r 'select(.target.kind == ["bench"] and .executable) | .executable' build.json)
          size=$(stat -c %s target/release/examples/bare_chart)
          # Wall-clock frame times vary between hosted runners, so the checked frame cost is the
          # instruction count of 300 frames, less that of start-up and warm-up alone.
          ir() { BARE_CHART_FRAMES=$1 valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null \
                 "$bench" 2>&1 | sed -n 's/.*I *refs: *//p' | tr -d ,; }
          ir0=$(ir 0); ir300=$(ir 300)
          [[ $ir0 =~ ^[0-9]+$ && $ir300 =~ ^[0-9]+$ ]] || { echo "::error::Cachegrind reported no instruction count"; exit 1; }
          instr=$(( (ir300 - ir0) / 300 ))
          wall=$("$bench")
          fail=0
          # Name, baseline key, this build, tolerance in percent.
          check() {
            local base change
            base=$(sed -n "s/^$2=//p" benches/bare_chart.baseline)
            change=$(awk -v b="$base" -v v="$3" 'BEGIN { if (b > 0) printf "%+.2f%%", (v - b) * 100 / b; else print "n/a" }')
            echo "| $1 | ${base:-none} | $3 | $change | +$4% |" >> "$GITHUB_STEP_SUMMARY"
            if [[ $change == n/a ]] || awk -v c="$change" -v t="$4" 'BEGIN { exit !(c + 0 > t) }'; then
              echo "::error title=Bare chart::$1 grew from ${base:-none} to $3 ($change), above the +$4% tolerance"
              fail=1
            fi
          }
          {
            echo "### Bare chart (\`--no-default-features --features widget\`)"
            echo
            echo '| Figure | Baseline | This build | Change | Tolerance |'
            echo '|---|---:|---:|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"
          check "Stripped size of \`examples/bare_chart\`, bytes" size_bytes "$size" 1
          check "Instructions per frame of \`benches/bare_chart.rs\`" frame_instructions "$instr" 2
          {
            echo
            echo "Frame time, not checked: $wall. Runner: $(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)."
            echo
            echo "To accept these figures, commit them to \`benches/bare_chart.baseline\` and say why in the pull request:"
            echo
            echo "    size_bytes=$size"
            echo "    frame_instructions=$instr"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

  performance-measure:
    name: Measure chart performance (head)
    needs: changes
    if: "!cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.event.pull_request.draft != true"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      base: ${{ steps.base.outputs.counts }}
      head: ${{ steps.head.outputs.counts }}
      processor: ${{ steps.measurement.outputs.processor }}
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - name: Identify measurement cache
        if: needs.changes.outputs.rust == 'true'
        id: measurement
        env:
          WORKLOAD_HASH: ${{ hashFiles('benches/frame_time.rs', 'benches/frame/**', 'benches/regression/**', 'benches/check-regressions.sh', 'examples/bare_chart.rs', '.github/workflows/ci.yml') }}
        run: |
          processor=$(awk -F ': ' '/^model name[[:space:]]*:/ { print $2; exit }' /proc/cpuinfo)
          # glibc selects routines by processor features, which change the instruction counts.
          processor_hash=$(awk '/^(model name|flags)[[:space:]]*:/ { print; if (++fields == 2) exit }' /proc/cpuinfo | sha256sum | cut -c1-16)
          echo "processor=$processor" >> "$GITHUB_OUTPUT"
          echo "key=performance-v1-ubuntu-24.04-1.95.0-${ImageVersion}-$(getconf GNU_LIBC_VERSION)-$processor_hash-$WORKLOAD_HASH" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          key: head
          workspaces: . -> target
      - name: Install Valgrind
        if: needs.changes.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Build the head workload
        if: needs.changes.outputs.rust == 'true'
        run: cargo build --release --locked --bench frame_time --message-format=json-render-diagnostics > performance.json
      - name: Measure head instructions
        if: needs.changes.outputs.rust == 'true'
        id: head
        run: |
          bench=$(jq -r 'select(.target.name == "frame_time" and .executable) | .executable' performance.json)
          bash benches/check-regressions.sh --measure "$bench" > performance-counts.txt
          {
            echo 'counts<<COUNTS'
            cat performance-counts.txt
            echo COUNTS
          } >> "$GITHUB_OUTPUT"
      - name: Save main measurement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: performance-counts.txt
          key: ${{ steps.measurement.outputs.key }}-${{ github.sha }}
      - name: Restore base measurement
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
        id: cached
        uses: actions/cache/restore@v5
        with:
          path: performance-counts.txt
          key: ${{ steps.measurement.outputs.key }}-${{ needs.changes.outputs.base }}
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && steps.cached.outputs.cache-hit != 'true'
        with:
          ref: ${{ needs.changes.outputs.base }}
          path: performance-base
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && steps.cached.outputs.cache-hit != 'true'
        with:
          key: base
          workspaces: performance-base -> target
      - name: Use the same workloads for the base library
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && steps.cached.outputs.cache-hit != 'true'
        run: |
          cp -r benches/frame benches/regression performance-base/benches/
          cp benches/frame_time.rs performance-base/benches/frame_time.rs
          cp examples/bare_chart.rs performance-base/examples/bare_chart.rs
          if grep -q 'pub enum TradeSide' performance-base/src/model/quote.rs; then
            sed -i 's/\bOrderSide\b/TradeSide/g' performance-base/benches/frame_time.rs
          fi
          if ! grep -rq 'pub enum BubbleGrouping' performance-base/src/chart/overlays; then
            sed -i -e 's/{BubbleGrouping, VolumeBubblesConfig}/VolumeBubblesConfig/' \
              -e 's/grouping: BubbleGrouping::PriceStep(step),/price_step: Some(step),/' \
              performance-base/benches/frame_time.rs
          fi
          if ! grep -q 'impl HistoryPage' performance-base/src/data/mod.rs; then
            sed -i 's/HistoryPage::new(self\.0\.clone(), true)/HistoryPage { bars: self.0.clone(), end_of_history: true }/' \
              performance-base/benches/frame_time.rs
          fi
          if ! grep -q 'fn add_synced_drawing.*-> Result' performance-base/src/drawings/manager/edit.rs; then
            sed -i 's/\.expect("bench drawings are valid")//' performance-base/benches/frame_time.rs
          fi
      - name: Build the base workload
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && steps.cached.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path performance-base/Cargo.toml --bench frame_time --message-format=json-render-diagnostics > performance.json
      - name: Measure base instructions
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push' && steps.cached.outputs.cache-hit != 'true'
        run: |
          bench=$(jq -r 'select(.target.name == "frame_time" and .executable) | .executable' performance.json)
          bash benches/check-regressions.sh --measure "$bench" > performance-counts.txt
      - name: Publish base instruction counts
        if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
        id: base
        run: |
          {
            echo 'counts<<COUNTS'
            cat performance-counts.txt
            echo COUNTS
          } >> "$GITHUB_OUTPUT"

  performance:
    name: Chart performance regressions
    needs: [changes, performance-measure]
    if: "!cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.event.pull_request.draft != true"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - name: Test instruction comparison
        if: needs.changes.outputs.rust == 'true'
        run: python3 benches/check-regressions-test.py
      - name: Reject instruction growth over five percent
        if: needs.changes.outputs.rust == 'true'
        env:
          MEASUREMENT_RESULT: ${{ needs.performance-measure.result }}
          BASE_COUNTS: ${{ needs.performance-measure.outputs.base }}
          HEAD_COUNTS: ${{ needs.performance-measure.outputs.head }}
          PROCESSOR: ${{ needs.performance-measure.outputs.processor }}
        run: |
          test "$MEASUREMENT_RESULT" = success
          printf '%s\n' "$BASE_COUNTS" > performance-base.txt
          printf '%s\n' "$HEAD_COUNTS" > performance-head.txt
          printf 'Processor: %s\n\n' "$PROCESSOR" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          bash benches/check-regressions.sh --compare performance-base.txt performance-head.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  terminal:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Terminal package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.terminal == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.terminal == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.terminal == 'true'
        with:
          workspaces: terminal
      - name: Clippy
        if: needs.changes.outputs.terminal == 'true'
        run: cargo clippy --locked --manifest-path terminal/Cargo.toml --all-targets -- -D warnings
      - name: Test
        if: needs.changes.outputs.terminal == 'true'
        run: cargo test --locked --manifest-path terminal/Cargo.toml

  fmt:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.fmt == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.fmt == 'true'
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        if: needs.changes.outputs.fmt == 'true'
      - name: Check the crates outside the workspace
        if: needs.changes.outputs.fmt == 'true'
        run: for m in examples/demo examples/docs terminal docs/capture fuzz; do cargo fmt --manifest-path $m/Cargo.toml -- --check || exit 1; done

  doc:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs == 'true'
      - name: Check docs build
        if: needs.changes.outputs.docs == 'true'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Check docs build (no default features)
        if: needs.changes.outputs.docs == 'true'
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Check docs build (widget only)
        if: needs.changes.outputs.docs == 'true'
        run: cargo doc --no-deps --no-default-features --features widget
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Check documented catalogue counts
        if: needs.changes.outputs.counts == 'true' && needs.changes.outputs.rust != 'true'
        run: cargo test --all-features --lib stated_counts_match_code

  security:
    needs: changes
    if: "!cancelled() && github.event.pull_request.draft != true"
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check input classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.security == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.security == 'true'
      # The library loads only its embedded SVG icons, the engine without
      # default features must not depend on egui or a windowing backend, and
      # the bare chart must not depend on the icon loader or export codecs.
      - name: Check dependency tree
        if: needs.changes.outputs.security == 'true'
        run: |
          default=$(cargo tree --locked -e normal --prefix none)
          headless=$(cargo tree --locked -e normal --no-default-features --prefix none)
          widget=$(cargo tree --locked -e normal --no-default-features --features widget --prefix none)
          icons=$(cargo tree --locked -e normal --no-default-features --features icons --prefix none)
          studies=$(cargo tree --locked -e normal --no-default-features --features studies --prefix none)
          banned=$(grep -E '^(rustls|ureq|ehttp|image) v' <<< "$default" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::default features depend on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui|egui_extras|epaint|winit|chrono-tz|csv|csv-core|ryu) v' <<< "$headless" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--no-default-features depends on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui_extras|png|csv|csv-core|ryu) v' <<< "$widget" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--features widget depends on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui|epaint|winit) v' <<< "$studies" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--features studies depends on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui_extras|enum-map|enum-map-derive) v' <<< "$icons" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--features icons depends on: $banned"; exit 1; fi
          # The deployed demo must build the versions its committed lockfile pins.
          (cd examples/demo && cargo tree --locked > /dev/null)
          (cd examples/docs && cargo tree --locked > /dev/null)
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.security == 'true'
        with:
          tool: cargo-deny@0.19.0
      - name: Check advisories, duplicate versions and licences
        if: needs.changes.outputs.security == 'true'
        run: |
          cargo deny --all-features --locked check advisories bans licenses
          cargo deny --manifest-path examples/demo/Cargo.toml --all-features --locked check advisories bans licenses
          cargo deny --manifest-path examples/docs/Cargo.toml --all-features --locked check advisories bans licenses
