name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  # Runs the suite on any branch, such as reviewed pull requests merged together before they land.
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks; every main commit keeps its run.
# Draft state is part of the group: marking a draft ready fires a run that still carries the draft
# payload, and that run only skips its jobs, so it must not cancel the real run beside it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  semver:
    if: github.event.pull_request.draft != true
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the latest published crate version
        id: baseline
        shell: bash
        run: |
          version=$(curl --fail --silent --show-error --retry 3 -A "egui-charts-ci (https://github.com/userFRM/egui-charts)" https://crates.io/api/v1/crates/egui-charts | jq -er '.crate.newest_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the declared release against the published API
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-version: ${{ steps.baseline.outputs.version }}

  check:
    if: github.event.pull_request.draft != true
    name: Check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, 1.95.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy with --all-targets compiles each configuration, so it doubles as the build check.
      # The minimum supported Rust version only needs to prove it compiles the full feature set.
      - name: Check module dependencies
        if: matrix.rust == 'stable'
        run: python3 .github/check-module-cycles.py
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Clippy (default)
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (headless engine)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Clippy (widget only)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features widget --all-targets -- -D warnings
      - name: Clippy (widget with drawings)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features widget,drawings --all-targets -- -D warnings
      - name: Clippy (studies only)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features studies --all-targets -- -D warnings
      - name: Clippy (alert engine only)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features alert-engine --all-targets -- -D warnings
      - name: Clippy (order-flow detectors only)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features detectors --all-targets -- -D warnings
      - name: Clippy (strategies only)
        if: matrix.rust == 'stable'
        run: cargo clippy --no-default-features --features strategies --all-targets -- -D warnings

  test:
    if: github.event.pull_request.draft != true
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The full suite runs once on Linux stable; the other platforms run the all-features library
      # tests, which exercise every module. The minimum supported Rust version only needs to
      # compile, which the check job proves.
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable, full: true }
          - { os: macos-latest, rust: stable, full: false }
          - { os: windows-latest, rust: stable, full: false }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run library tests (all features)
        run: cargo test --all-features --lib
      - name: Run library tests (no default features)
        if: matrix.full
        run: cargo test --no-default-features --lib
      - name: Run workflow example tests
        if: matrix.full
        run: cargo test --all-features --example scripting --example backtesting
      - name: Run library tests (UI without named time zones)
        if: matrix.full
        run: cargo test --no-default-features --features ui --lib
      - name: Run doc tests (all features)
        if: matrix.full
        run: cargo test --doc --all-features
      - name: Run doc tests (no default features)
        run: cargo test --doc --no-default-features
      - name: Run doc tests (widget only)
        if: matrix.full
        run: cargo test --doc --no-default-features --features widget

  wasm-test:
    if: github.event.pull_request.draft != true
    name: Test (headless Chrome, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [all, widget]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Run browser widget tests
        run: >-
          wasm-pack test --headless --chrome --lib
          ${{ matrix.features == 'all' && '--all-features' || '--no-default-features --features widget' }}

  bare-chart:
    if: github.event.pull_request.draft != true
    name: Bare chart size and frame cost
    # Pinned image and compiler: the figures move with the code, the lockfile, the MSRV and the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: >-
          cargo build --release --locked --no-default-features --features widget
          --example bare_chart --bench bare_chart --message-format=json-render-diagnostics > build.json
      - name: Compare with benches/bare_chart.baseline
        run: |
          bench=$(jq -r 'select(.target.kind == ["bench"] and .executable) | .executable' build.json)
          size=$(stat -c %s target/release/examples/bare_chart)
          # Wall-clock frame times vary between hosted runners, so the checked frame cost is the
          # instruction count of 300 frames, less that of start-up and warm-up alone.
          ir() { BARE_CHART_FRAMES=$1 valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null \
                 "$bench" 2>&1 | sed -n 's/.*I *refs: *//p' | tr -d ,; }
          ir0=$(ir 0); ir300=$(ir 300)
          [[ $ir0 =~ ^[0-9]+$ && $ir300 =~ ^[0-9]+$ ]] || { echo "::error::Cachegrind reported no instruction count"; exit 1; }
          instr=$(( (ir300 - ir0) / 300 ))
          wall=$("$bench")
          fail=0
          # Name, baseline key, this build, tolerance in percent.
          check() {
            local base change
            base=$(sed -n "s/^$2=//p" benches/bare_chart.baseline)
            change=$(awk -v b="$base" -v v="$3" 'BEGIN { if (b > 0) printf "%+.2f%%", (v - b) * 100 / b; else print "n/a" }')
            echo "| $1 | ${base:-none} | $3 | $change | +$4% |" >> "$GITHUB_STEP_SUMMARY"
            if [[ $change == n/a ]] || awk -v c="$change" -v t="$4" 'BEGIN { exit !(c + 0 > t) }'; then
              echo "::error title=Bare chart::$1 grew from ${base:-none} to $3 ($change), above the +$4% tolerance"
              fail=1
            fi
          }
          {
            echo "### Bare chart (\`--no-default-features --features widget\`)"
            echo
            echo '| Figure | Baseline | This build | Change | Tolerance |'
            echo '|---|---:|---:|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"
          check "Stripped size of \`examples/bare_chart\`, bytes" size_bytes "$size" 1
          check "Instructions per frame of \`benches/bare_chart.rs\`" frame_instructions "$instr" 2
          {
            echo
            echo "Frame time, not checked: $wall. Runner: $(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)."
            echo
            echo "To accept these figures, commit them to \`benches/bare_chart.baseline\` and say why in the pull request:"
            echo
            echo "    size_bytes=$size"
            echo "    frame_instructions=$instr"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

  performance:
    name: Chart performance regressions
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          # A run started by hand compares against the default branch.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: performance-base
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            performance-base -> target
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Build the same workloads against both libraries
        run: |
          cp -r benches/frame benches/regression performance-base/benches/
          cp benches/frame_time.rs performance-base/benches/frame_time.rs
          cp examples/bare_chart.rs performance-base/examples/bare_chart.rs
          if grep -q 'pub enum TradeSide' performance-base/src/model/quote.rs; then
            sed -i 's/\bOrderSide\b/TradeSide/g' performance-base/benches/frame_time.rs
          fi
          if ! grep -rq 'pub enum BubbleGrouping' performance-base/src/chart/overlays; then
            sed -i -e 's/{BubbleGrouping, VolumeBubblesConfig}/VolumeBubblesConfig/' \
              -e 's/grouping: BubbleGrouping::PriceStep(step),/price_step: Some(step),/' \
              performance-base/benches/frame_time.rs
          fi
          if ! grep -q 'impl HistoryPage' performance-base/src/data/mod.rs; then
            sed -i 's/HistoryPage::new(self\.0\.clone(), true)/HistoryPage { bars: self.0.clone(), end_of_history: true }/' \
              performance-base/benches/frame_time.rs
          fi
          cargo build --release --locked --bench frame_time --message-format=json-render-diagnostics > performance-head.json
          cargo build --release --locked --manifest-path performance-base/Cargo.toml --bench frame_time --message-format=json-render-diagnostics > performance-base.json
      - name: Reject instruction growth over five percent
        run: |
          base=$(jq -r 'select(.target.name == "frame_time" and .executable) | .executable' performance-base.json)
          head=$(jq -r 'select(.target.name == "frame_time" and .executable) | .executable' performance-head.json)
          set -o pipefail
          bash benches/check-regressions.sh "$base" "$head" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  native-demo:
    if: github.event.pull_request.draft != true
    name: Native demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/demo
      - name: Install Linux graphics and window tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Build native demo
        run: cargo build --locked --manifest-path examples/demo/Cargo.toml
      - name: Test demo controller
        run: cargo test --locked --manifest-path examples/demo/Cargo.toml
      - name: Start native demo on Linux
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a -e /dev/stderr examples/demo/smoke-native.sh examples/demo/target/debug/egui-charts-demo

  terminal:
    if: github.event.pull_request.draft != true
    name: Terminal package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal
      - name: Clippy
        run: cargo clippy --locked --manifest-path terminal/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path terminal/Cargo.toml

  fmt:
    if: github.event.pull_request.draft != true
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check the crates outside the workspace
        run: for m in examples/demo terminal docs/capture fuzz; do cargo fmt --manifest-path $m/Cargo.toml -- --check || exit 1; done

  doc:
    if: github.event.pull_request.draft != true
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check docs build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Check docs build (no default features)
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Check docs build (widget only)
        run: cargo doc --no-deps --no-default-features --features widget
        env:
          RUSTDOCFLAGS: -Dwarnings

  security:
    if: github.event.pull_request.draft != true
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The library loads only its embedded SVG icons, the engine without
      # default features must not depend on egui or a windowing backend, and
      # the bare chart must not depend on the icon loader or the UI's error
      # types itself (egui may use thiserror internally).
      - name: Check dependency tree
        run: |
          default=$(cargo tree --locked -e normal --prefix none)
          headless=$(cargo tree --locked -e normal --no-default-features --prefix none)
          widget=$(cargo tree --locked -e normal --no-default-features --features widget --depth 1 --prefix none)
          studies=$(cargo tree --locked -e normal --no-default-features --features studies --prefix none)
          banned=$(grep -E '^(rustls|ureq|ehttp|image) v' <<< "$default" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::default features depend on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui|egui_extras|epaint|winit|chrono-tz) v' <<< "$headless" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--no-default-features depends on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui_extras|thiserror) v' <<< "$widget" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--features widget depends on: $banned"; exit 1; fi
          banned=$(grep -E '^(egui|epaint|winit) v' <<< "$studies" | sort -u || true)
          if [ -n "$banned" ]; then echo "::error::--features studies depends on: $banned"; exit 1; fi
          # The deployed demo must build the versions its committed lockfile pins.
          (cd examples/demo && cargo tree --locked > /dev/null)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
      - name: Check advisories, duplicate versions and licences
        run: |
          cargo deny --all-features --locked check advisories bans licenses
          cargo deny --manifest-path examples/demo/Cargo.toml --all-features --locked check advisories bans licenses
