[package]
name = "egui-charts"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "High-performance financial charting engine for egui — candlesticks, 95 drawing tools, 130+ indicators, and a full design-token theme system"
repository = "https://github.com/userFRM/egui-charts"
homepage = "https://github.com/userFRM/egui-charts"
documentation = "https://docs.rs/egui-charts"
authors = ["userFRM"]
keywords = ["trading", "charts", "finance", "egui", "candlestick"]
categories = ["visualization", "gui", "graphics", "rendering::engine"]
readme = "README.md"
# `examples/demo` is a self-contained `eframe`+`wgpu`/Trunk workspace built only
# by Trunk, never by the host crate.  Auto-discovery would otherwise pick up
# `examples/demo/main.rs` as a `demo` example and try to build it here, so the
# example set is declared explicitly instead.
autoexamples = false
exclude = [
    "plan.md",
    "ROADMAP.md",
    ".github/",
    "tests/",
    "benches/",
    "*.png",
    "*.gif",
    "*.mp4",
]

[lib]
path = "src/lib.rs"

[[example]]
name = "basic_chart"
path = "examples/basic_chart.rs"

[[example]]
name = "with_indicators"
path = "examples/with_indicators.rs"

[[example]]
name = "drawing_tools"
path = "examples/drawing_tools.rs"

[[example]]
name = "tauri_integration"
path = "examples/tauri_integration.rs"

[features]
default = ["icons"]
## Compile-time embedded SVG icons (280+).  Required by the `ui` feature and
## by any code that uses `icons::Icon` or the icon helpers on `UiExt`.
icons = []
## Application-level UI components: toolbars, panels, sidebars, dialogs, and
## the reusable `ui_kit` widget library they are built on.  Enable this when
## you are building a full trading-terminal interface around the chart engine.
ui = ["icons"]
## Backtesting framework for strategy evaluation on historical data.
backtest = []
## Embedded scripting support for user-defined indicators and strategies.
scripting = []

[dev-dependencies]
# The bundled examples are standalone `eframe` apps; they need a windowing
# backend to run natively.  `glow` keeps the default-feature build buildable on
# CI without a Vulkan/Metal toolchain, and the `x11`/`wayland` platform features
# are required because `default-features = false` otherwise leaves `winit`
# without a Linux backend.
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.33.3"

[dependencies]
egui = { version = "0.33.3", features = ["serde"] }
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = "0.10.4"
web-time = "1.1.0"
csv = "1.4.0"
thiserror = "2.0.18"
log = "0.4.29"
once_cell = "1.21.3"
ron = "0.12.0"
rand = "0.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3.85", features = ["Storage"] }
getrandom = { version = "0.4.1", features = ["wasm_js"] }
