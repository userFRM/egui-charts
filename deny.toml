# Check every target and feature, including example and test dependencies.
[advisories]
yanked = "deny"
# Development/example-only accessibility dependencies still require zbus 5, even in
# accesskit_unix 0.24.1. Remove these exceptions when that backend supports zbus 6.
# These are maintenance notices, with no patched standalone releases.
ignore = [
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.5 via eframe 0.37 accessibility; awaiting backend migration to zbus 6" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.1 via eframe 0.37 accessibility; awaiting backend migration to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.1 via eframe 0.37 accessibility; awaiting backend migration to zbus 6" },
]

[licenses]
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "OFL-1.1", "Ubuntu-font-1.0",
    "Unicode-3.0", "Unlicense", "Zlib",
]

# The unpublished demo is checked for its dependencies' licences.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
# Existing upstream splits in the renderer, platform backends and proc macros.
# Pin exceptions to the older versions; new duplicates require review here.
# The demo also needs getrandom 0.2 and phf 0.11 through its web dependencies.
skip = [
    # The SVG renderer uses 0.22; the demo HTTP image loader uses 0.23.
    { name = "base64", version = "=0.22.1" },
    { name = "bitflags", version = "=1.3.2" },
    { name = "block2", version = "=0.5.1" },
    { name = "calloop", version = "=0.13.0" },
    { name = "calloop-wayland-source", version = "=0.3.0" },
    { name = "foldhash", version = "=0.1.5" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "jni-sys", version = "=0.3.1" },
    { name = "kurbo", version = "=0.11.3" },
    { name = "linux-raw-sys", version = "=0.4.15" },
    { name = "miniz_oxide", version = "=0.8.9" },
    { name = "objc2", version = "=0.5.3" },
    { name = "objc2-app-kit", version = "=0.2.2" },
    { name = "objc2-foundation", version = "=0.2.2" },
    { name = "objc2-ui-kit", version = "=0.2.2" },
    { name = "phf", version = "=0.11.3" },
    { name = "phf", version = "=0.12.1" },
    { name = "phf_shared", version = "=0.11.3" },
    { name = "phf_shared", version = "=0.12.1" },
    { name = "png", version = "=0.17.16" },
    { name = "r-efi", version = "=5.3.0" },
    { name = "redox_syscall", version = "=0.4.1" },
