[book]
title = "egui-charts"
description = "Build financial charts with your own data, in Rust and egui."
language = "en"
src = "src"

[build]
build-dir = "../../target/book"

[output.html]
additional-css = ["theme/guide.css"]
default-theme = "light"
preferred-dark-theme = "coal"
no-section-label = true
sidebar-header-nav = false
smart-punctuation = false
site-url = "/egui-charts/docs/"
git-repository-url = "https://github.com/userFRM/egui-charts"

[output.html.playground]
runnable = false

[output.html.search]
enable = true

[output.html.print]
enable = false
