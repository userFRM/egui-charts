[package]
name = "egui-charts-capture"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone like `examples/demo`: built on its own, never by the library crate.
[workspace]

[[bin]]
name = "capture"
path = "main.rs"

[dependencies]
egui-charts = { path = "../..", features = ["ui", "alert-engine"] }
# The demo's dependencies, plus the offscreen renderer.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wgpu", "persistence"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["svg", "image", "file", "http"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe"] }
chrono = "0.4.43"
log = "0.4.29"
maudio = "0.1.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
